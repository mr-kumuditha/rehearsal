# Replace __BACKEND_DOMAIN__ before installing this bootstrap virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name __BACKEND_DOMAIN__;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/rehearsal-acme;
    }
    location / {
        return 503;
    }
}
