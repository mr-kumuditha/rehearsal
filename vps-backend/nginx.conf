# Replace __BACKEND_DOMAIN__ before installing. The certificate must exist.
limit_req_zone $binary_remote_addr zone=rehearsal_ip:1m rate=10r/s;
limit_req_zone $server_name zone=rehearsal_global:1m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __BACKEND_DOMAIN__;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/rehearsal-acme;
    }
    location / {
        return 308 https://__BACKEND_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __BACKEND_DOMAIN__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/__BACKEND_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__BACKEND_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rehearsal_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 2k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=rehearsal_ip burst=20 nodelay;
        limit_req zone=rehearsal_global burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
